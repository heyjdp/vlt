name: CI

on:
  push:
    branches: [main]
    # A v* tag (e.g. v0.1.0) also publishes a GitHub release.
    tags: ["v*"]
  pull_request:
    branches: [main]
  # Weekly, so govulncheck reports a newly published vulnerability in a
  # dependency even when nothing has been pushed.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  # The weekly run has its own group, so it can never replace a push run
  # waiting on main (GitHub keeps one pending run per group).
  group: ci-${{ github.event_name }}-${{ github.ref }}
  # Superseded pull-request runs are cancelled; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Tool versions are pinned so CI results are reproducible.
  GOLANGCI_LINT_VERSION: v2.15.0
  GOVULNCHECK_VERSION: v1.9.0
  ACTIONLINT_VERSION: v1.7.12
  ZIZMOR_VERSION: 1.32.0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The tags, so the release-notes test checks every release's notes.
          fetch-depth: 0

      # go-version-file honours go.mod's toolchain directive (a patched Go).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true # zizmor: ignore[cache-poisoning] these jobs only check; nothing they build is shipped
          cache-dependency-path: go.sum

      # libwayland-dev: Fyne 2.8's GLFW 3.4 builds its Wayland backend too.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev

      # Formatting (gofumpt, goimports) is checked here too, as configured in
      # .golangci.yml. golangci-lint releases before v2.14 cannot read the
      # Go 1.27 standard library's export data, hence the pinned version.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

      - name: Test the release-notes script
        run: packaging/release-notes-test.sh

      # On a release tag, fail before anything is packaged if CHANGELOG.md
      # has no dated section for it (the release notes come from there).
      - name: Check the release notes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: packaging/release-notes.sh "$TAG" > /dev/null

  # The workflow itself and the shell scripts: actionlint (which also runs
  # shellcheck on every run: block), zizmor's security audit, and shellcheck
  # on packaging/.
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only to build actionlint; go install checks the module against the
      # Go checksum database.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: actionlint
        run: |
          go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
          # The runner image ships shellcheck; actionlint uses it when found.
          shellcheck --version
          "$(go env GOPATH)/bin/actionlint" -color

      # Installs zizmor from a hash-pinned wheel. Online audits (impostor
      # commits, known-vulnerable actions) use the read-only job token.
      # Findings become annotations; nothing is uploaded to code scanning.
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: ${{ env.ZIZMOR_VERSION }}
          advanced-security: false
          annotations: true

      - name: shellcheck
        run: shellcheck packaging/*.sh packaging/*/*.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true # zizmor: ignore[cache-poisoning] these jobs only check; nothing they build is shipped
          cache-dependency-path: go.sum

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev

      - name: Check go.mod and go.sum
        run: |
          go mod tidy -diff
          go mod verify

      - name: Vet
        run: go vet ./...

      # UI tests use fyne.io/fyne/v2/test, which renders in software and
      # needs no display.
      - name: Test (with race detector)
        run: go test -race -timeout 10m -coverprofile=coverage.out ./...

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true # zizmor: ignore[cache-poisoning] these jobs only check; nothing they build is shipped
          cache-dependency-path: go.sum

      # govulncheck type-checks every package, including Fyne's cgo ones,
      # which need the C headers ("could not import C" without them).
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev

      - name: Install govulncheck
        run: go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"

      - name: Vulnerability scan
        run: govulncheck ./...

  build:
    # Fyne's desktop driver needs cgo (OpenGL/GLFW), so each OS builds on its
    # own runner instead of cross-compiling with CGO_ENABLED=0.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history and tags, so git describe can name the release.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true # zizmor: ignore[cache-poisoning] these jobs only check; nothing they build is shipped
          cache-dependency-path: go.sum

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: go build -trimpath -ldflags="-s -w -X main.version=$(git describe --tags --match 'v[0-9]*' --always --dirty)" ./cmd/vlt

  # Installable packages, built once lint, the workflow checks, tests and
  # the vulnerability scan pass on a push to main or a tag. Pull requests
  # and the weekly run skip them.
  package-macos:
    needs: [lint, workflow-lint, test, vuln]
    if: github.event_name == 'push'
    # Apple silicon. The app is ad-hoc signed, not notarised.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # No cache: shipped packages are built from scratch, so a poisoned
          # cache entry can never end up in a release.
          cache: false

      - name: Package vlt.app
        run: make package-mac

      - name: Check the bundle
        run: |
          plutil -p vlt.app/Contents/Info.plist
          # The binary must not need a newer macOS than Info.plist claims.
          minos=$(otool -l vlt.app/Contents/MacOS/vlt | awk '/LC_BUILD_VERSION/ { f = 1 } f && $1 == "minos" { print $2; exit }')
          claimed=$(plutil -extract LSMinimumSystemVersion raw vlt.app/Contents/Info.plist)
          echo "binary minos $minos, Info.plist $claimed"
          test "$minos" = "$claimed"
          cd dist
          for zip in vlt-*-macos-arm64.zip; do shasum -a 256 "$zip" > "$zip.sha256"; done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vlt-macos
          path: dist/vlt-*-macos-arm64.zip*
          if-no-files-found: error

  package-linux:
    needs: [lint, workflow-lint, test, vuln]
    if: github.event_name == 'push'
    # The oldest supported runner: the AppImage needs a glibc at least as
    # new as the one it was built against (2.35 here).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # No cache: shipped packages are built from scratch, so a poisoned
          # cache entry can never end up in a release.
          cache: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev desktop-file-utils

      - name: Validate the desktop entry
        run: desktop-file-validate packaging/linux/vlt.desktop

      - name: Package the AppImage
        run: make package-linux

      - name: Check the AppImage contents
        run: |
          cd dist
          appimage=$(ls vlt-*-x86_64.AppImage)
          "./$appimage" --appimage-extract >/dev/null
          test -x squashfs-root/usr/bin/vlt
          test -f squashfs-root/vlt.desktop
          rm -rf squashfs-root
          sha256sum "$appimage" > "$appimage.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vlt-linux
          path: dist/vlt-*-x86_64.AppImage*
          if-no-files-found: error

  release:
    needs: [package-macos, package-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Write the release notes
        env:
          TAG: ${{ github.ref_name }}
        run: packaging/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # The notes are the tag's CHANGELOG.md section. A re-run replaces the
        # files and notes of a release that already exists.
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "vlt $TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
